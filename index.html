<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Wealth Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
        .dark .glass { background: rgba(15, 23, 42, 0.85); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen pb-24">

<header class="glass sticky top-0 z-30 border-b border-slate-200 dark:border-slate-800 px-4 py-3">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="bg-emerald-600 p-2 rounded-xl text-white"><i class="fa-solid fa-wallet"></i></div>
            <span class="font-black text-lg">WealthTracker</span>
        </div>
        <div class="flex gap-2">
            <button id="logout-btn" onclick="handleLogout()" class="hidden w-9 h-9 rounded-full bg-red-100 dark:bg-red-900/30 text-red-600 items-center justify-center"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </div>
</header>

<main class="max-w-5xl mx-auto px-4 pt-6">

    <!-- AUTHENTICATION -->
    <div id="view-auth" class="mt-10 max-w-md mx-auto bg-white dark:bg-slate-900 p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl">
        <h2 class="text-2xl font-black text-center mb-6">User Access</h2>
        <div class="space-y-4">
            <input type="email" id="auth-email" class="w-full p-4 rounded-xl bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 font-bold" placeholder="Email">
            <input type="password" id="auth-password" class="w-full p-4 rounded-xl bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 font-bold" placeholder="Password">
            <div class="flex gap-4 pt-2">
                <button onclick="handleLogin()" class="flex-1 bg-emerald-600 text-white font-black py-4 rounded-xl">LOG IN</button>
                <button onclick="handleSignup()" class="flex-1 bg-slate-200 dark:bg-slate-800 font-black py-4 rounded-xl">SIGN UP</button>
            </div>
            <p id="auth-error" class="text-xs text-red-500 text-center hidden"></p>
        </div>
    </div>

    <!-- MAIN APP CONTENT -->
    <div id="app-content" class="hidden space-y-6">
        
        <!-- TOP METRICS DASHBOARD -->
        <div class="bg-gradient-to-br from-emerald-600 to-teal-700 p-6 rounded-3xl text-white shadow-xl">
            <div class="flex justify-between items-start">
                <div>
                    <p class="text-xs font-bold uppercase opacity-80">Remaining Balance</p>
                    <h2 class="text-4xl font-black mt-1" id="balance-display">₹0</h2>
                </div>
                <button onclick="updateSalaryPrompt()" class="bg-white/20 px-3 py-1.5 rounded-xl text-xs font-bold backdrop-blur-md">
                    <i class="fa-solid fa-pen"></i> Set In-Hand
                </button>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-6">
                <div class="bg-white/10 p-3 rounded-2xl backdrop-blur-md">
                    <p class="text-[9px] uppercase font-bold opacity-70">In-Hand Salary</p>
                    <p class="text-sm font-bold" id="stat-salary">₹0</p>
                </div>
                <div class="bg-white/10 p-3 rounded-2xl backdrop-blur-md">
                    <p class="text-[9px] uppercase font-bold opacity-70">Fixed Expenses</p>
                    <p class="text-sm font-bold" id="stat-fixed">₹0</p>
                </div>
                <div class="bg-white/10 p-3 rounded-2xl backdrop-blur-md">
                    <p class="text-[9px] uppercase font-bold opacity-70">Variable Spent</p>
                    <p class="text-sm font-bold" id="stat-variable">₹0</p>
                </div>
            </div>
        </div>

        <!-- FILTER CONTROLS -->
        <div class="flex justify-between items-center bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800">
            <span class="text-xs font-bold text-slate-400 uppercase">Dashboard Scope</span>
            <select id="time-filter" onchange="updateUI()" class="bg-slate-100 dark:bg-slate-800 font-extrabold text-xs px-3 py-2 rounded-xl outline-none">
                <option value="month">This Month</option>
                <option value="week">This Week</option>
                <option value="year">This Year</option>
            </select>
        </div>

        <!-- CHARTS SECTION -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-200 dark:border-slate-800">
                <h3 class="text-xs font-bold uppercase text-slate-400 mb-2">Category Breakdown</h3>
                <div class="h-48"><canvas id="categoryChart"></canvas></div>
            </div>
            <div class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-200 dark:border-slate-800">
                <h3 class="text-xs font-bold uppercase text-slate-400 mb-2">Spending Trend</h3>
                <div class="h-48"><canvas id="timelineChart"></canvas></div>
            </div>
        </div>

        <!-- RECURRING EXPENSES (EMI & RENT) MANAGEMENT -->
        <div class="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200 dark:border-slate-800 space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-black uppercase text-slate-400"><i class="fa-solid fa-arrows-rotate"></i> Fixed Monthly Expenses (EMIs, Rent)</h3>
                <button onclick="addOrEditEMI()" class="text-xs font-bold bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 px-3 py-1.5 rounded-xl">+ Add EMI/Rent</button>
            </div>
            <div id="recurring-list" class="space-y-2"></div>
        </div>

        <!-- DAILY LOG FORM -->
        <div class="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200 dark:border-slate-800 space-y-4">
            <h3 class="text-sm font-black uppercase text-slate-400"><i class="fa-solid fa-plus"></i> Log Variable Expense</h3>
            <form id="expense-form" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                <input type="text" id="exp-details" placeholder="Description (e.g., Grocery)" required class="p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border dark:border-slate-700 text-sm font-bold">
                <select id="exp-category" class="p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border dark:border-slate-700 text-sm font-bold">
                    <option value="Food">🍔 Food & Dining</option>
                    <option value="Shopping">🛍️ Shopping</option>
                    <option value="Travel">🚗 Travel</option>
                    <option value="Bills">💡 Utilities</option>
                    <option value="Other">📝 Other</option>
                </select>
                <input type="number" id="exp-cost" placeholder="Amount (₹)" required class="p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border dark:border-slate-700 text-sm font-bold">
                <button type="submit" class="bg-emerald-600 text-white font-black p-3 rounded-xl">SAVE</button>
            </form>
        </div>

        <!-- EXPENSE HISTORY -->
        <div class="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200 dark:border-slate-800 space-y-3">
            <h3 class="text-sm font-black uppercase text-slate-400">Transaction History</h3>
            <div id="history-list" class="space-y-2"></div>
        </div>

    </div>
</main>

<script>
    const SUPABASE_URL = 'https://xmkiumvkdmtgfiyntgqg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhta2l1bXZrZG10Z2ZpeW50Z3FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NDcyNjAsImV4cCI6MjEwMjUyMzI2MH0.toduMHrsZZyUsJq9OnR6r4XSw9thfzakdO46JZKC-8U';
    const PYTHON_BACKEND_URL = 'https://fe-and-be.onrender.com/api'; 

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentSession = null;
    let expensesData = [];
    let recurringData = [];
    let inHandSalary = 0;
    let categoryChart = null, timelineChart = null;

    supabaseClient.auth.onAuthStateChange((event, session) => {
        currentSession = session;
        if (session) {
            document.getElementById('view-auth').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            document.getElementById('logout-btn').classList.add('flex');
            loadInitialData();
        } else {
            document.getElementById('view-auth').classList.remove('hidden');
            document.getElementById('app-content').classList.add('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
        }
    });

    async function handleLogin() {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if(error) alert(error.message);
    }

    async function handleSignup() {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;
        const { error } = await supabaseClient.auth.signUp({ email, password });
        if(error) alert(error.message); else alert("Account created! Logging in...");
    }

    async function handleLogout() { await supabaseClient.auth.signOut(); }

    async function loadInitialData() {
        const headers = { 'Authorization': `Bearer ${currentSession.access_token}` };
        
        // Fetch Salary
        const profRes = await fetch(`${BACKEND_URL}/profile`, { headers });
        const profData = await profRes.json();
        inHandSalary = profData.in_hand_salary || 0;

        // Fetch Recurring
        const recRes = await fetch(`${BACKEND_URL}/recurring`, { headers });
        recurringData = await recRes.json();

        // Fetch Expenses
        const expRes = await fetch(`${BACKEND_URL}/expenses`, { headers });
        expensesData = await expRes.json();

        updateUI();
    }

    async function updateSalaryPrompt() {
        const newSal = prompt("Enter your monthly total in-hand salary (₹):", inHandSalary);
        if (newSal !== null) {
            await fetch(`${BACKEND_URL}/profile`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentSession.access_token}` },
                body: JSON.stringify({ in_hand_salary: newSal })
            });
            loadInitialData();
        }
    }

    async function addOrEditEMI(id = null, oldName = '', oldAmount = '') {
        const name = prompt("Enter EMI/Rent Name:", oldName);
        if (!name) return;
        const amount = prompt("Enter Monthly Amount (₹):", oldAmount);
        if (!amount) return;

        await fetch(`${BACKEND_URL}/recurring`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentSession.access_token}` },
            body: JSON.stringify({ id, name, amount, active: true })
        });
        loadInitialData();
    }

    async function deleteEMI(id) {
        if(confirm("Delete this recurring item?")) {
            await fetch(`${BACKEND_URL}/recurring/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${currentSession.access_token}` }
            });
            loadInitialData();
        }
    }

    document.getElementById('expense-form').onsubmit = async (e) => {
        e.preventDefault();
        const payload = {
            details: document.getElementById('exp-details').value,
            category: document.getElementById('exp-category').value,
            cost: document.getElementById('exp-cost').value,
            date: new Date().toISOString()
        };

        await fetch(`${BACKEND_URL}/expenses`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentSession.access_token}` },
            body: JSON.stringify(payload)
        });
        e.target.reset();
        loadInitialData();
    };

    async function deleteExpense(id) {
        if(confirm("Delete expense record?")) {
            await fetch(`${BACKEND_URL}/expenses/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${currentSession.access_token}` }
            });
            loadInitialData();
        }
    }

    function updateUI() {
        const filter = document.getElementById('time-filter').value;
        const now = new Date();

        // Filter Variable Expenses based on Week, Month, Year
        const filteredExpenses = expensesData.filter(item => {
            const itemDate = new Date(item.date);
            if (filter === 'week') {
                const diffTime = Math.abs(now - itemDate);
                return diffTime / (1000 * 60 * 60 * 24) <= 7;
            } else if (filter === 'month') {
                return itemDate.getMonth() === now.getMonth() && itemDate.getFullYear() === now.getFullYear();
            } else if (filter === 'year') {
                return itemDate.getFullYear() === now.getFullYear();
            }
        });

        // Compute Totals
        const totalFixed = recurringData.reduce((acc, cur) => acc + (cur.active ? cur.amount : 0), 0);
        const totalVariable = filteredExpenses.reduce((acc, cur) => acc + cur.cost, 0);
        const remainingBalance = inHandSalary - (totalFixed + totalVariable);

        document.getElementById('stat-salary').innerText = `₹${inHandSalary.toLocaleString()}`;
        document.getElementById('stat-fixed').innerText = `₹${totalFixed.toLocaleString()}`;
        document.getElementById('stat-variable').innerText = `₹${totalVariable.toLocaleString()}`;
        document.getElementById('balance-display').innerText = `₹${remainingBalance.toLocaleString()}`;

        // Render Recurring List
        const recEl = document.getElementById('recurring-list');
        recEl.innerHTML = recurringData.map(item => `
            <div class="flex justify-between items-center bg-slate-50 dark:bg-slate-800 p-3 rounded-xl">
                <div>
                    <span class="font-bold text-sm">${item.name}</span>
                    <span class="text-xs text-slate-400 block font-semibold uppercase">${item.category}</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="font-black text-slate-700 dark:text-slate-200">₹${item.amount}</span>
                    <button onclick="addOrEditEMI('${item.id}', '${item.name}', ${item.amount})" class="text-xs text-blue-500 font-bold"><i class="fa-solid fa-pen"></i></button>
                    <button onclick="deleteEMI('${item.id}')" class="text-xs text-red-500 font-bold"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
        `).join('');

        // Render Expense History
        const histEl = document.getElementById('history-list');
        histEl.innerHTML = filteredExpenses.map(item => `
            <div class="flex justify-between items-center bg-slate-50 dark:bg-slate-800 p-3 rounded-xl">
                <div>
                    <span class="font-bold text-sm">${item.details || item.category}</span>
                    <span class="text-[10px] text-slate-400 block font-bold uppercase">${new Date(item.date).toLocaleDateString()}</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="font-black text-emerald-600">₹${item.cost}</span>
                    <button onclick="deleteExpense('${item.id}')" class="text-xs text-red-400"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
        `).join('');

        renderCharts(filteredExpenses);
    }

    function renderCharts(expenses) {
        const catMap = {};
        expenses.forEach(e => catMap[e.category] = (catMap[e.category] || 0) + e.cost);

        if(categoryChart) categoryChart.destroy();
        categoryChart = new Chart(document.getElementById('categoryChart'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(catMap),
                datasets: [{ data: Object.values(catMap), backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6'] }]
            },
            options: { maintainAspectRatio: false }
        });

        const timeMap = {};
        expenses.forEach(e => {
            const d = new Date(e.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            timeMap[d] = (timeMap[d] || 0) + e.cost;
        });

        if(timelineChart) timelineChart.destroy();
        timelineChart = new Chart(document.getElementById('timelineChart'), {
            type: 'line',
            data: {
                labels: Object.keys(timeMap),
                datasets: [{ label: 'Spent', data: Object.values(timeMap), borderColor: '#10b981', fill: false }]
            },
            options: { maintainAspectRatio: false }
        });
    }
</script>
</body>
</html>
